[package]
name = "gitplume"
version = "0.1.0"
edition = "2024"
description = "A fast terminal app for reviewing and staging your Git changes"
license = "GPL-3.0-or-later"
repository = "https://github.com/LBognanni/gitplume"
readme = "README.md"
keywords = ["git", "tui", "terminal", "diff", "staging"]
categories = ["command-line-utilities", "development-tools"]
include = ["/src/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE"]

[dependencies]
crossterm = "0.29.0"
directories = "6.0.0"
emojis = "0.9.0"
notify-debouncer-full = "0.7.0"
ratatui = "0.30.2"
tree-sitter = "0.27.0"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-cpp = "0.23.4"
tree-sitter-css = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-html = "0.23.2"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-lua = "0.5.0"
tree-sitter-md = "0.5.3"
tree-sitter-php = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.2"
tree-sitter-sequel = "0.3.11"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7.2"
unicode-width = "0.2.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
